name: Release immutable image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run validate:production-flow
      - run: npm run validate:operations
      - run: npm run inventory:tenant-entry-points
      - name: Validate deployment secrets without exposing values
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORTIFY_APP_DATABASE_URL: ${{ secrets.FORTIFY_APP_DATABASE_URL }}
          FORTIFY_APP_ORIGIN: ${{ vars.FORTIFY_APP_ORIGIN }}
          FORTIFY_OIDC_PROVIDER_KEY: ${{ vars.FORTIFY_OIDC_PROVIDER_KEY }}
          FORTIFY_OIDC_ISSUER: ${{ vars.FORTIFY_OIDC_ISSUER }}
          FORTIFY_OIDC_CLIENT_ID: ${{ secrets.FORTIFY_OIDC_CLIENT_ID }}
          FORTIFY_OIDC_CLIENT_SECRET: ${{ secrets.FORTIFY_OIDC_CLIENT_SECRET }}
          FORTIFY_STORAGE_BUCKET: ${{ vars.FORTIFY_STORAGE_BUCKET }}
          FORTIFY_STORAGE_REGION: ${{ vars.FORTIFY_STORAGE_REGION }}
          FORTIFY_STORAGE_KMS_KEY_ID: ${{ vars.FORTIFY_STORAGE_KMS_KEY_ID }}
          FORTIFY_REQUEST_HASH_KEY: ${{ secrets.FORTIFY_REQUEST_HASH_KEY }}
        run: FORTIFY_RUNTIME_MODE=production node --import tsx -e "import { validateProductionEnvironment } from './lib/production/environment.ts'; validateProductionEnvironment();"
      - name: Apply forward-only migrations before release
        env:
          FORTIFY_RUNTIME_MODE: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORTIFY_APP_DATABASE_URL: ${{ secrets.FORTIFY_APP_DATABASE_URL }}
        run: npm run db:migrate:production
      - name: Prove managed PostgreSQL role and pooled tenant isolation
        if: inputs.environment == 'staging'
        env:
          FORTIFY_RUNTIME_MODE: production
          FORTIFY_VALIDATION_ENVIRONMENT: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORTIFY_APP_DATABASE_URL: ${{ secrets.FORTIFY_APP_DATABASE_URL }}
        run: npm run db:validate:managed-postgres > managed-postgres-validation.json
      - name: Preserve managed PostgreSQL validation receipt
        if: inputs.environment == 'staging'
        uses: actions/upload-artifact@v4
        with:
          name: managed-postgres-validation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: managed-postgres-validation.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Record immutable release receipt
        run: echo "environment=${{ inputs.environment }} sha=${{ github.sha }} image=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
