name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.13.0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Quality and deterministic artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Verify blank sandbox migration explicitly
        run: npm run test:migration
      - run: npm run build
      - run: npm run demo:evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-demo-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/evaluation/demo-evaluation.json
            output/pdf/*.pdf
            output/packets/*.zip

  browser:
    name: Guided browser regression
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/

  security:
    name: Dependency and committed-secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run security:secrets

  sast:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  container:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag fortify-ci:${{ github.sha }} .
      - name: Scan high and critical operating-system and library findings
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.59.1 image
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          fortify-ci:${{ github.sha }}
