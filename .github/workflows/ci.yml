name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.13.0
  NEXT_TELEMETRY_DISABLED: 1
  FORTIFY_RUNTIME_MODE: sandbox

jobs:
  quality:
    name: Quality and deterministic artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run demo:evaluate
      - run: npm run security:claims
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-demo-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/evaluation/demo-evaluation.json
            output/pdf/*.pdf
            output/packets/*.zip

  contracts:
    name: Contract tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: access-control
            target: tests/access-control-service.test.ts
          - label: brokerage-case
            target: tests/brokerage-case.test.ts
          - label: document-pipeline
            target: tests/document-pipeline.test.ts
          - label: funding-project
            target: tests/funding-project.test.ts
          - label: governed-source
            target: tests/governed-source.test.ts
          - label: identity-authorization
            target: tests/identity-authorization.test.ts
          - label: integrations
            target: tests/integrations.test.ts
          - label: market-playbook
            target: tests/market-playbook.test.ts
          - label: model-recognition
            target: tests/model-recognition.test.ts
          - label: operational-hardening
            target: tests/operational-hardening.test.ts
          - label: portfolio-import
            target: tests/portfolio-import.test.ts
          - label: production-data-plane
            target: tests/production-data-plane.test.ts
          - label: programme-analytics
            target: tests/programme-analytics.test.ts
          - label: property-graph
            target: tests/property-graph.test.ts
          - label: recognition-submission
            target: tests/recognition-submission.test.ts
          - label: resilience-planning
            target: tests/resilience-planning.test.ts
          - label: secure-object-storage
            target: tests/secure-object-storage.test.ts
          - label: verification-governance
            target: tests/verification-governance.test.ts
          - label: lightweight-repository
            target: >-
              tests/artifacts.test.ts tests/domain.test.ts tests/migration.test.ts
              tests/prohibited-claims.test.ts tests/repository.test.ts tests/runtime.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run one host-isolated contract shard
        env:
          TEST_TARGETS: ${{ matrix.target }}
        run: >-
          npx vitest run --pool=threads --maxWorkers=1 --no-file-parallelism
          $TEST_TARGETS

  browser:
    name: Guided browser regression
    runs-on: ubuntu-latest
    needs: [quality, contracts]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/

  security:
    name: Dependency and committed-secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run security:secrets
      - run: npm run security:claims

  sast:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  container:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag fortify-ci:${{ github.sha }} .
      - name: Scan high and critical operating-system and library findings
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.59.1 image
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          fortify-ci:${{ github.sha }}

  release-contract:
    name: Accessibility, visual, and production-flow contracts
    runs-on: ubuntu-latest
    needs: [quality, contracts]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run validate:production-flow
      - run: npm run validate:operations
